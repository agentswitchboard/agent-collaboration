[package]
name = "central-link-protocol"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
autotests = false

[features]
test-support = []
wire-export = ["dep:specta", "dep:specta-serde", "dep:specta-typescript", "workspace-model/wire-export", "workspace-ids/wire-export"]

[dependencies]
approval-request-protocol.workspace = true
fleet-identity-protocol = { path = "../fleet-identity-protocol", version = "0.1.156" }
fleet-rpc.workspace = true
schemars.workspace = true
workspace-model.workspace = true
workspace-ids.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
uuid = { workspace = true, features = ["serde"] }

[dev-dependencies]
jsonschema.workspace = true

[lints]
workspace = true

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
specta = { workspace = true, features = ["derive"], optional = true }
specta-serde = { workspace = true, optional = true }
specta-typescript = { workspace = true, optional = true }
