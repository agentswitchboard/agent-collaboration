[package]
name = "switchboard-session-store"
autotests = false
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[features]
test-support = ["sqlite-storage-maintenance/test-support"]

[lints]
workspace = true

[dependencies]
chrono.workspace = true
collaboration-protocol = { path = "../collaboration-protocol", version = "0.1.14" }
