serde_json.workspace = true
sqlite-storage-maintenance = { path = "../sqlite-storage-maintenance", version = "0.1.118" }
sqlx = { workspace = true, features = ["macros", "migrate", "sqlite"] }
thiserror.workspace = true
tokio.workspace = true

[dev-dependencies]
tempfile = "3.27.0"
