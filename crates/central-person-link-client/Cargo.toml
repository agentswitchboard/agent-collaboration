[package]
name = "central-person-link-client"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
autotests = false

[lints]
workspace = true

[features]
test-support = ["axum/form", "axum/json", "axum/ws", "dep:rcgen", "dep:tokio-rustls", "dep:tokio-util"]

[dependencies]
approval-request-protocol.workspace = true
axum = { workspace = true, features = ["http1", "tokio"] }
base64.workspace = true
central-link-protocol.workspace = true
fleet-identity-protocol = { path = "../fleet-identity-protocol", version = "0.1.156" }
fleet-rpc.workspace = true
futures-util.workspace = true
rcgen = { version = "0.14", optional = true }
reqwest.workspace = true
reqwest-websocket = "=0.5.1"
ring = "=0.17.14"
router-clock.workspace = true
serde.workspace = true
serde_json.workspace = true
state-machine-core.workspace = true
thiserror.workspace = true
tokio.workspace = true
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"], optional = true }
tokio-util = { workspace = true, optional = true }
tungstenite = { version = "=0.27.0", default-features = false }
url.workspace = true
uuid.workspace = true
workspace-ids.workspace = true
zeroize = { workspace = true, features = ["serde"] }

[target.'cfg(target_os = "macos")'.dependencies]
core-foundation = "0.10.1"
security-framework.workspace = true

[dev-dependencies]
axum = { workspace = true, features = ["form", "http1", "json", "tokio", "ws"] }
central-person-link-client = { path = ".", features = ["test-support"] }
central-storage.workspace = true
chrono.workspace = true
collaboration-central-conformance = { path = "../collaboration-central-conformance", version = "0.1.158", features = ["signin-test-support", "session-link-test-support"] }
collaboration-central-core = { path = "../collaboration-central-core", version = "0.1.158" }
collaboration-central-tokio = { path = "../collaboration-central-tokio", version = "0.1.158", features = ["test-support"] }
fleet-contracts.workspace = true
fleet-runtime = { workspace = true, features = ["test-support"] }
reqwest = { workspace = true, features = ["json"] }
router-clock = { workspace = true, features = ["test-support"] }
tempfile = "3.27.0"
tokio-util.workspace = true
hegel = { package = "hegeltest", version = "=0.52.6", features = ["static-engine"] }

[[test]]
name = "integration"
path = "tests/integration/main.rs"
