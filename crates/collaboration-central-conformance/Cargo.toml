[package]
autotests = false
name = "collaboration-central-conformance"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[features]
signin-test-support = ["dep:approval-request-protocol", "dep:central-storage", "dep:reqwest", "dep:chrono", "dep:tokio", "dep:sha2", "dep:ring", "dep:base64", "dep:axum", "dep:serde_json"]

session-link-test-support = ["dep:approval-request-protocol", "dep:chrono","central-link-protocol/test-support", "dep:central-storage", "dep:fleet-identity-protocol", "dep:fleet-rpc", "dep:futures-util", "dep:reqwest-websocket", "dep:serde_json", "dep:workspace-ids"]

[dependencies]
approval-request-protocol = { workspace = true, optional = true }
central-link-protocol = { workspace = true, optional = true }
central-storage = { workspace = true, optional = true }
fleet-identity-protocol = { path = "../fleet-identity-protocol", version = "0.1.158", optional = true }
fleet-rpc = { workspace = true, optional = true }
futures-util = { version = "0.3.34", optional = true }
reqwest-websocket = { version = "=0.5.1", optional = true }
workspace-ids = { workspace = true, optional = true }
reqwest = { workspace = true, features = ["json"], optional = true }
chrono = { workspace = true, optional = true }
axum = { workspace = true, optional = true, features = ["http1", "tokio", "json"] }
base64 = { version = "0.22.1", optional = true }
ring = { version = "=0.17.14", optional = true }
serde_json = { workspace = true, optional = true }
sha2 = { workspace = true, optional = true }
tokio = { workspace = true, optional = true }
