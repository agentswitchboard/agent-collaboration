[package]
name = "fleet-signin"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
autotests = false

[lints]
workspace = true

[features]
test-support = ["fleet-runtime/test-support"]

[dependencies]
base64 = "0.22.1"
central-storage.workspace = true
chrono = { version = "0.4.45", default-features = false, features = ["alloc"] }
fleet-contracts.workspace = true
fleet-identity-protocol = { path = "../fleet-identity-protocol", version = "0.1.156" }
fleet-runtime.workspace = true
fleet-runtime-ports.workspace = true
futures-util.workspace = true
schemars.workspace = true
serde.workspace = true
serde_json.workspace = true
sqlx = { version = "=0.9.0", default-features = false, features = ["derive"] }
state-machine-core.workspace = true
thiserror.workspace = true
uuid = { workspace = true, features = ["serde"] }
workspace-ids.workspace = true

[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
fleet-storage-schema.workspace = true
sqlx = { workspace = true, features = ["sqlite", "macros", "migrate"] }
tempfile = "3.27.0"
trybuild.workspace = true

[dev-dependencies]
central-engine-model.workspace = true
ring = "0.17.14"
sha2 = "0.10.9"

hegel = { package = "hegeltest", version = "=0.52.6", features = ["static-engine"] }
tokio.workspace = true

[[test]]
name = "integration"
path = "tests/integration/main.rs"
