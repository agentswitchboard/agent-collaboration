[package]
name = "switchboard-central-link"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
autotests = false

[features]
test-support = []

[dependencies]
futures-util.workspace = true
http-body-util.workspace = true
hyper.workspace = true
hyper-rustls = { workspace = true, features = ["ring"] }
hyper-util.workspace = true
log.workspace = true
serde_json.workspace = true
tokio.workspace = true
tokio-tungstenite.workspace = true
tower-service = "0.3.3"
central-link-client.workspace = true
central-link-protocol.workspace = true
router-clock.workspace = true
state-machine-core.workspace = true
workspace-ids.workspace = true
workspace-model.workspace = true

[dev-dependencies]
hegel = { package = "hegeltest", version = "=0.52.6", features = ["static-engine"] }
router-clock = { workspace = true, features = ["test-support"] }
tracing.workspace = true
tracing-subscriber.workspace = true

[lints]
workspace = true

[[test]]
name = "integration"
path = "tests/integration/main.rs"
required-features = ["test-support"]
