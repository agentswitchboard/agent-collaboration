name: Central native guard Linux proof

on:
  push:
    branches: [fix/central-native-guard-crash]

permissions:
  contents: read

jobs:
  repeat:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_INCREMENTAL: "0"
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.98.1
          components: rustfmt
      - uses: actions/setup-node@v4
        with:
          node-version-file: verification/package.json
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: verification/package.json
      - run: pnpm --dir verification install --frozen-lockfile
      - name: Check chunk-boundary and feature negatives
        run: node --test verification/tooling/central-native-artifacts.test.ts
      - name: Run the actual guard step 50 times
        shell: bash
        run: |
          node --version
          ldd --version | head -1
          cargo_messages="$RUNNER_TEMP/central-native-artifacts.jsonl"
          for attempt in $(seq 1 50); do
            cargo build --locked -p collaboration-central-tokio --lib --no-default-features --message-format=json-render-diagnostics > "$cargo_messages"
            node verification/tooling/check-central-native-artifacts.ts "$cargo_messages"
            printf 'linux attempt %02d passed\n' "$attempt"
          done
          echo "Cargo JSON bytes: $(wc -c < "$cargo_messages")"
          jq -r 'select(.reason=="compiler-artifact") | .target.name as $name | select(
            ["central_engine_model","collaboration_central_core","collaboration_central_tokio","fleet_engine","fleet_mail","fleet_runtime","fleet_schedules","fleet_storage_schema","fleet_store_sqlx","fleet_wakes"] | index($name)
          ) | .filenames[] | select(endswith(".rlib"))' "$cargo_messages" |
            while IFS= read -r artifact; do stat --printf='%s %n\n' "$artifact"; done
